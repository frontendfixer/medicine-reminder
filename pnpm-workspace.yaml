packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 11 fails installs on unreviewed dependency build scripts (strictDepBuilds, R-62).
# esbuild's postinstall only swaps in the native binary as an optimisation; not needed.
allowBuilds:
  esbuild: false
  msgpackr-extract: false # optional native accelerator for BullMQ's msgpack; falls back to JavaScript
